name: Story QA, Pages, Android and Quest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - name: Play the adventure through the public controls
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Adventure-Browser-QA
          path: |
            test-results/
            playwright-report/
  web:
    needs: qa
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package offline web experience
        run: |
          mkdir -p dist/assets
          cp index.html app.js pixel-duel.js pixel-duel.css music.js worlds.js journey.js sequel.js sequel-worlds.js RGBELoader.js style.css three.module.js manifest.webmanifest sw.js THREE-LICENSE.txt dist/
          cp -r assets/* dist/assets/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: web
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package assets including rendered original score
        run: |
          mkdir -p android/app/src/main/assets/assets
          cp index.html app.js pixel-duel.js pixel-duel.css music.js worlds.js journey.js sequel.js sequel-worlds.js RGBELoader.js style.css three.module.js manifest.webmanifest sw.js THREE-LICENSE.txt android/app/src/main/assets/
          cp -r assets/* android/app/src/main/assets/assets/
      - name: Build mobile and Quest APKs
        working-directory: android
        run: gradle assembleMobileDebug assembleQuestDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ElSegon-Android-Mobile
          path: android/app/build/outputs/apk/mobile/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ElSegon-MetaQuest
          path: android/app/build/outputs/apk/quest/debug/*.apk
